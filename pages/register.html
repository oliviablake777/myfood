<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 美食天下</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .auth-container { max-width: 420px; margin: 50px auto; background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #eee; }
        .auth-header { padding: 25px; text-align: center; border-bottom: 1px solid #eee; font-size: 20px; font-weight: bold; color: #333; }
        .auth-body { padding: 30px 40px; }
        .form-item { margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; font-weight: bold; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-wrapper input:focus { border-color: #ff4757; }
        
        /* 短信验证码按钮 */
        .sms-btn { position: absolute; right: 8px; background: #f8f9fa; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; font-size: 12px; color: #ff4757; cursor: pointer; transition: 0.3s; }
        .sms-btn:hover { background: #fff1f2; border-color: #ff4757; }
        .sms-btn:disabled { cursor: not-allowed; color: #999; border-color: #eee; }

        .protocol { font-size: 13px; color: #666; display: flex; align-items: center; gap: 8px; margin: 25px 0; }
        .protocol a { color: #ff4757; text-decoration: none; }
        
        .submit-btn { width: 100%; padding: 14px; background: #ff4757; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #ff6b81; transform: translateY(-1px); }
        .auth-footer { text-align: center; padding-bottom: 30px; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">美食天下</div>
        <ul class="nav-links">
            <li><a href="../index.html">首页</a></li>
            <li><a href="category.html">分类</a></li>
            <li><a href="login.html" style="color:#ff4757">登录</a></li>
        </ul>
    </nav>

    <div id="app">
        <div class="auth-container">
            <div class="auth-header">注 册</div>
            <div class="auth-body">
                <!-- 手机号 -->
                <div class="form-item">
                    <label>手机号</label>
                    <div class="input-wrapper">
                        <input type="text" v-model="phone" placeholder="请输入手机号">
                    </div>
                </div>

                <!-- 短信验证码 -->
                <div class="form-item">
                    <label>短信验证码</label>
                    <div class="input-wrapper">
                        <input type="text" v-model="smsCode" placeholder="请输入验证码">
                        <button class="sms-btn" @click="sendSms" :disabled="countdown > 0">
                            {{ countdown > 0 ? countdown + 's后重发' : '获取验证码' }}
                        </button>
                    </div>
                </div>

                <!-- 密码 -->
                <div class="form-item">
                    <label>设置密码</label>
                    <div class="input-wrapper">
                        <input type="password" v-model="pw1" placeholder="6-16位字母或数字">
                    </div>
                </div>

                <!-- 确认密码 -->
                <div class="form-item">
                    <label>确认密码</label>
                    <div class="input-wrapper">
                        <input type="password" v-model="pw2" placeholder="请再次输入密码">
                    </div>
                </div>

                <!-- 协议勾选 -->
                <div class="protocol">
                    <input type="checkbox" v-model="agree">
                    <span>我已阅读并接受 <a href="#">隐私政策</a> 和 <a href="#">服务协议</a></span>
                </div>

                <button class="submit-btn" @click="handleRegister">立即注册</button>
            </div>
            <div class="auth-footer">
                已有账号？<a href="login.html" style="color:#ff4757; text-decoration:none;">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    phone: '', smsCode: '', pw1: '', pw2: '',
                    agree: false, countdown: 0
                }
            },
            methods: {
                sendSms() {
                    if(!/^1[3-9]\d{9}$/.test(this.phone)) return alert('请输入正确的手机号');
                    this.countdown = 60;
                    const timer = setInterval(() => {
                        this.countdown--;
                        if(this.countdown <= 0) clearInterval(timer);
                    }, 1000);
                    alert('验证码已发送至您的手机');
                },
                handleRegister() {
                    if(!this.agree) return alert('请先同意协议');
                    if(this.pw1 !== this.pw2) return alert('两次密码不一致');
                    if(!this.smsCode) return alert('请输入短信验证码');
                    alert('注册成功！');
                    window.location.href = 'login.html';
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
