<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 美食天下</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #eee; }
        .auth-header { padding: 25px; text-align: center; border-bottom: 1px solid #eee; font-size: 20px; font-weight: bold; color: #333; }
        .auth-body { padding: 30px 40px; }
        .form-item { margin-bottom: 25px; }
        .form-item label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; font-weight: bold; }
        .input-wrapper input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
        .input-wrapper input:focus { border-color: #ff4757; }
        .submit-btn { width: 100%; padding: 14px; background: #ff4757; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #ff6b81; }
        .auth-footer { text-align: center; padding: 0 0 30px 0; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">美食天下</div>
        <ul class="nav-links">
            <li><a href="../index.html">首页</a></li>
            <li><a href="register.html" style="color:#ff4757">注册</a></li>
        </ul>
    </nav>

    <div id="app">
        <div class="auth-container">
            <div class="auth-header">登 录</div>
            <div class="auth-body">
                <div class="form-item">
                    <label>手机号 / 账号</label>
                    <div class="input-wrapper">
                        <input type="text" v-model="account" placeholder="请输入手机号">
                    </div>
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <div class="input-wrapper">
                        <input type="password" v-model="password" placeholder="请输入密码">
                    </div>
                </div>
                <div style="text-align: right; margin-bottom: 25px;">
                    <a href="#" style="font-size: 12px; color: #999; text-decoration: none;">忘记密码？</a>
                </div>
                <button class="submit-btn" @click="handleLogin">立即登录</button>
            </div>
            <div class="auth-footer">
                还没有账号？<a href="register.html" style="color:#ff4757; text-decoration:none;">立即注册</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { account: '', password: '' } },
            methods: {
                handleLogin() {
                    if(!this.account || !this.password) return alert('请输入账号和密码');
                    alert('登录成功！欢迎回到美食世界');
                    window.location.href = '../index.html';
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
