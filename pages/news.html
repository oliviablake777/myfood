        .news-header { background: #fff; padding: 40px; border-radius: 20px; margin-bottom: 30px; display: flex; gap: 30px; align-items: center; box-shadow: var(--shadow); }

        .news-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .news-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: var(--shadow); transition: var(--transition); }
        .news-card:hover { transform: translateY(-5px); }
        .news-tag { background: #eee; color: #666; padding: 3px 10px; border-radius: 5px; font-size: 12px; }
        .news-date { color: var(--text-grey); font-size: 13px; float: right; }
